name: Publish YouTube
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify
        run: |
          python kit/tools/build.py --sdk-free oussem_youtube
          node kit/tools/test_parked.js
          node kit/tools/test_ridetube.js
          python tools/publish_catalog.py
      - name: Publish immutable app and update catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("apps/oussem_youtube/app.json"))["version"])')
          tag="youtube-$version"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "YouTube $version (WIP)" --notes "Based on JustAnotherPU/RideTube, GPL-3.0-or-later."
          gh release upload "$tag" "dist/oussem_youtube@$version.tgz"
          gh release upload catalog dist/catalog.json --clobber
