name: Validate YouTube
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build without proprietary SDK
        run: python kit/tools/build.py --sdk-free oussem_youtube
      - name: Test native app, renderer and simulated vehicle signals
        run: |
          node kit/tools/test_runtime.js
          node kit/tools/test_life.js
          node kit/tools/test_parked.js
          node kit/tools/test_qr.js
          node kit/tools/test_ridetube.js
      - name: Test upstream service
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd native/jap-ridetube-d
          node test/test_ytd.js
          node test/test_thumb.js
          python3.12 -I test/test_ytfetch.py
  waze-cluster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Waze on cluster app
        run: |
          node apps/robertn_waze_cluster/tools/test_control.js
          node apps/robertn_waze_cluster/tools/test_page.js
          node apps/robertn_waze_cluster/tools/test_profiles.js
          node apps/robertn_waze_cluster/tools/test_i18n.js
      - name: Check the wide map probe script
        run: sh -n native/waze-on-cluster/tools/wide-probe.sh
      - name: Test the wide map layout
        run: node native/waze-on-cluster/patch/test/wide_test.js
      - name: Check the staged waze-on-cluster tool
        run: node tools/stage_waze_on_cluster.js --check
