# waze-on-cluster (wide map fork): with Android Auto's wide layout, patchd
# writes cluster-render's settings for it to the file below, a line
# WOC_CLUSTER_RENDER_ARGS=-s panel_slot=<slot> -s panel_take_over_stock=1,
# which override cluster-render.conf at its next start. Without the file
# the line expands to nothing and cluster-render starts as shipped.
[Service]
EnvironmentFile=-/var/opt/waze-on-cluster/cluster-render.env
ExecStart=
ExecStart=/var/opt/cluster-render/current/cluster-render -c /var/opt/cluster-render/current/cluster-render.conf $WOC_CLUSTER_RENDER_ARGS
